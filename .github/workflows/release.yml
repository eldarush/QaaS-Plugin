name: Release plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read

env:
  CANONICAL_REPOSITORY: TheSmokeTeam/QaaS-Plugin

jobs:
  build:
    if: github.repository == 'TheSmokeTeam/QaaS-Plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve requested tag
        id: requested
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${DISPATCH_TAG}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vX.Y.Z." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.requested.outputs.tag }}

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Prove release identity
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.requested.outputs.tag }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${CANONICAL_REPOSITORY}"
          version="$(node -p "JSON.parse(require('fs').readFileSync('version.json', 'utf8')).version")"
          test "${RELEASE_TAG}" = "v${version}"
          commit="$(git rev-list --max-count=1 "${RELEASE_TAG}")"
          test "${commit}" = "$(git rev-parse HEAD)"
          {
            echo "commit=${commit}"
            echo "tag=${RELEASE_TAG}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate, test, and package
        run: npm run check

      - name: Verify reproducible package
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/qaas-plugin-${VERSION}.zip"
          first="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          node tools/package-plugin.mjs
          second="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          test "${first}" = "${second}"
          (
            cd dist
            sha256sum --check "qaas-plugin-${VERSION}.zip.sha256"
          )

      - name: Upload verified plugin artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qaas-plugin-release
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/qaas-plugin-${{ steps.release.outputs.version }}.zip
            dist/qaas-plugin-${{ steps.release.outputs.version }}.zip.sha256
            dist/qaas-plugin-${{ steps.release.outputs.version }}.zip.manifest.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Download verified plugin artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qaas-plugin-release
          path: dist

      - name: Publish or verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum --check "qaas-plugin-${VERSION}.zip.sha256"
          )
          expected_json="$(node tools/release-assets.mjs "${VERSION}" --json)"

          object_type="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq .object.type
          )"
          object_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq .object.sha
          )"
          depth=0
          while [[ "${object_type}" == "tag" && "${depth}" -lt 8 ]]; do
            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
            object_type="$(jq -r .object.type <<< "${tag_json}")"
            object_sha="$(jq -r .object.sha <<< "${tag_json}")"
            depth=$((depth + 1))
          done
          test "${object_type}" = "commit"
          test "${object_sha}" = "${RELEASE_COMMIT}"

          if ! release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null
          )"; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "QaaS Plugin ${RELEASE_TAG}" \
              --notes "Validated QaaS Claude Code plugin release."
            release_json="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
            )"
          fi

          RELEASE_JSON="${release_json}" EXPECTED_JSON="${expected_json}" node -e '
            const release = JSON.parse(process.env.RELEASE_JSON);
            const expected = new Set(JSON.parse(process.env.EXPECTED_JSON));
            const names = (release.assets ?? []).map((asset) => asset.name);
            if (new Set(names).size !== names.length) {
              throw new Error("Release contains duplicate asset names.");
            }
            const unexpected = names.filter((name) => !expected.has(name));
            if (unexpected.length) {
              throw new Error("Release contains unexpected assets: " + unexpected.join(", "));
            }
            if (release.prerelease !== true) {
              throw new Error("Release must remain a prerelease.");
            }
          '

          is_immutable="$(jq -r '.immutable == true' <<< "${release_json}")"
          comparison="$(mktemp -d)"
          existing_json="$(jq -c '[.assets[].name]' <<< "${release_json}")"
          EXISTING_JSON="${existing_json}" node -e '
            for (const name of JSON.parse(process.env.EXISTING_JSON)) {
              process.stdout.write(name + "\n");
            }
          ' | while IFS= read -r name; do
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${name}" \
              --dir "${comparison}"
            cmp --silent "dist/${name}" "${comparison}/${name}"
          done

          while IFS= read -r name; do
            if ! EXISTING_JSON="${existing_json}" NAME="${name}" node -e '
              process.exit(JSON.parse(process.env.EXISTING_JSON).includes(process.env.NAME) ? 0 : 1);
            '; then
              if [[ "${is_immutable}" == "true" ]]; then
                echo "Immutable release is missing ${name}." >&2
                exit 1
              fi
              gh release upload "${RELEASE_TAG}" "dist/${name}" \
                --repo "${GITHUB_REPOSITORY}"
            fi
          done < <(node tools/release-assets.mjs "${VERSION}")

          if [[ "${is_immutable}" != "true" ]]; then
            test "$(jq -r .draft <<< "${release_json}")" = "true"
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft=false \
              --prerelease
          fi

          for _ in $(seq 1 30); do
            final_json="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
            )"
            state="$(
              jq -r '[.draft, .prerelease, .immutable] | @tsv' <<< "${final_json}"
            )"
            if [[ "${state}" == $'false\ttrue\ttrue' ]]; then
              break
            fi
            sleep 2
          done
          test "${state}" = $'false\ttrue\ttrue'

          final_assets="$(jq -c '[.assets[].name] | sort' <<< "${final_json}")"
          expected_sorted="$(
            EXPECTED_JSON="${expected_json}" node -e '
              process.stdout.write(JSON.stringify(JSON.parse(process.env.EXPECTED_JSON).sort()));
            '
          )"
          test "${final_assets}" = "${expected_sorted}"
