name: Validate plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        node:
          - "18"
          - "20"
          - "22"
          - "24"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate and test
        run: npm run check

      - name: Verify reproducible package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath "version.json" | ConvertFrom-Json).version
          $archive = "dist/qaas-plugin-$version.zip"
          $first = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          node tools/package-plugin.mjs
          $second = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($first -ne $second) {
            throw "Package digest changed across identical builds."
          }

  documentation-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          docker run --rm \
            --volume "${PWD}:/repo:ro" \
            --workdir /repo \
            docker.io/rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Build and validate documentation
        run: npm --prefix docs-site run check

      - name: Validate source and generated Kubernetes deployments
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('version.json', 'utf8')).version")"
          digest="sha256:$(printf '0%.0s' {1..64})"
          QAAS_PLUGIN_DOCS_REGISTRY_DIGEST="${digest}" \
            node tools/package-docs-kubernetes.mjs
          docker run --rm \
            --volume "${PWD}:/repo:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary \
            /repo/deploy/kubernetes/qaas-plugin-docs.yaml \
            "/repo/dist/qaas-plugin-docs-kubernetes-${version}.yaml" \
            "/repo/dist/qaas-plugin-docs-kubernetes-airgap-${version}.yaml"

      - name: Build documentation image
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('version.json', 'utf8')).version")"
          revision="$(git rev-parse HEAD)"
          source_epoch="$(git show -s --format=%ct HEAD)"
          build_archive="dist/qaas-plugin-docs-${version}-linux-amd64.build-1.tar"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg "SOURCE_DATE_EPOCH=${source_epoch}" \
            --label "org.opencontainers.image.revision=${revision}" \
            --output "type=docker,dest=${build_archive},rewrite-timestamp=true" \
            --tag "docker.io/thesmoketeam/qaas-plugin-docs:${version}" \
            docs-site
          docker load --input "${build_archive}"

      - name: Verify deterministic offline image package across rebuilds
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('version.json', 'utf8')).version")"
          revision="$(git rev-parse HEAD)"
          source_epoch="$(git show -s --format=%ct HEAD)"
          image="docker.io/thesmoketeam/qaas-plugin-docs:${version}"
          first_build_archive="dist/qaas-plugin-docs-${version}-linux-amd64.build-1.tar"
          second_build_archive="dist/qaas-plugin-docs-${version}-linux-amd64.build-2.tar"
          QAAS_PLUGIN_DOCS_IMAGE="${image}" \
          QAAS_PLUGIN_DOCS_SOURCE_TAR="${first_build_archive}" \
          QAAS_PLUGIN_SOURCE_REVISION="${revision}" \
            node tools/package-docs-image.mjs
          first_archive="$(
            sha256sum "dist/qaas-plugin-docs-${version}-linux-amd64.tar.gz" |
              cut -d ' ' -f 1
          )"
          first_checksum="$(
            sha256sum "dist/qaas-plugin-docs-${version}-linux-amd64.tar.gz.sha256" |
              cut -d ' ' -f 1
          )"
          first_metadata="$(
            sha256sum "dist/qaas-plugin-docs-${version}-linux-amd64.tar.gz.metadata.json" |
              cut -d ' ' -f 1
          )"
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg "SOURCE_DATE_EPOCH=${source_epoch}" \
            --label "org.opencontainers.image.revision=${revision}" \
            --output "type=docker,dest=${second_build_archive},rewrite-timestamp=true" \
            --tag "${image}" \
            docs-site
          docker load --input "${second_build_archive}"
          QAAS_PLUGIN_DOCS_IMAGE="${image}" \
          QAAS_PLUGIN_DOCS_SOURCE_TAR="${second_build_archive}" \
          QAAS_PLUGIN_SOURCE_REVISION="${revision}" \
            node tools/package-docs-image.mjs
          second_archive="$(
            sha256sum "dist/qaas-plugin-docs-${version}-linux-amd64.tar.gz" |
              cut -d ' ' -f 1
          )"
          second_checksum="$(
            sha256sum "dist/qaas-plugin-docs-${version}-linux-amd64.tar.gz.sha256" |
              cut -d ' ' -f 1
          )"
          second_metadata="$(
            sha256sum "dist/qaas-plugin-docs-${version}-linux-amd64.tar.gz.metadata.json" |
              cut -d ' ' -f 1
          )"
          test "${first_archive}" = "${second_archive}"
          test "${first_checksum}" = "${second_checksum}"
          test "${first_metadata}" = "${second_metadata}"

      - name: Verify offline non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('version.json', 'utf8')).version")"
          image="docker.io/thesmoketeam/qaas-plugin-docs:${version}"
          container_id="$(
            docker run --detach --rm \
              --network none \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --user 10001:10001 \
              --env QAAS_PLUGIN_REPOSITORY_URL=https://github.com/TheSmokeTeam/QaaS-Plugin \
              --env QAAS_DOCS_HELM_URL=https://qaas-docs.internal.example/ \
              --env QAAS_DOCS_WIKIALL_URL=https://wikiall.internal.example/qaas/ \
              "${image}"
          )"
          trap 'docker stop "${container_id}" >/dev/null' EXIT
          healthy=0
          for _ in $(seq 1 30); do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")" == "healthy" ]]; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "${healthy}" -eq 1
          docker exec "${container_id}" node -e \
            "fetch('http://127.0.0.1:8080/').then(r=>r.text()).then(t=>{for(const v of ['https://github.com/TheSmokeTeam/QaaS-Plugin','https://qaas-docs.internal.example/','https://wikiall.internal.example/qaas/'])if(!t.includes(v))process.exit(1)})"
