name: Validate plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        node:
          - "18"
          - "20"
          - "22"
          - "24"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate and test
        run: npm run check

      - name: Verify reproducible package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath "version.json" | ConvertFrom-Json).version
          $archive = "dist/qaas-plugin-$version.zip"
          $first = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          node tools/package-plugin.mjs
          $second = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($first -ne $second) {
            throw "Package digest changed across identical builds."
          }

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          docker run --rm \
            --volume "${PWD}:/repo:ro" \
            --workdir /repo \
            docker.io/rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
