apiVersion: apps/v1
kind: Deployment
metadata:
  name: qaas-plugin-docs
  labels:
    app.kubernetes.io/name: qaas-plugin-docs
    app.kubernetes.io/part-of: qaas-plugin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qaas-plugin-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qaas-plugin-docs
        app.kubernetes.io/part-of: qaas-plugin
        app.kubernetes.io/version: "0.4.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: docker.io/thesmoketeam/qaas-plugin-docs:0.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: QAAS_PLUGIN_REPOSITORY_URL
              value: https://github.com/TheSmokeTeam/QaaS-Plugin
            - name: QAAS_PLUGIN_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: QAAS_DOCS_HELM_URL
              value: ""
            - name: QAAS_DOCS_WIKIALL_URL
              value: ""
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: qaas-plugin-docs
  labels:
    app.kubernetes.io/name: qaas-plugin-docs
    app.kubernetes.io/part-of: qaas-plugin
spec:
  selector:
    app.kubernetes.io/name: qaas-plugin-docs
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
